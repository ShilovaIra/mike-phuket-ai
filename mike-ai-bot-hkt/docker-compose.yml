services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mike}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mike} -d ${POSTGRES_DB:-mike}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Postgres is only reachable inside the Docker network (not published to the host).

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Bot builds DATABASE_URL from POSTGRES_* + this host (URL-encodes passwords).
      POSTGRES_HOST: db

  admin-api:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "admin_api"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"

volumes:
  postgres_data:

name: Test

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mike-ai-bot-hkt
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mike
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mike -d mike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mike:test@localhost:5432/mike
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest and fail if any test is skipped
        run: |
          set -o pipefail
          pytest --tb=short -ra | tee "$RUNNER_TEMP/pytest.txt"
          PYTEST_LOG="$RUNNER_TEMP/pytest.txt" python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          text = pathlib.Path(os.environ["PYTEST_LOG"]).read_text()
          summaries = re.findall(r"^=+.*?=+$", text, re.MULTILINE)
          if not summaries:
              sys.exit("pytest summary missing")
          summary = summaries[-1]
          skipped = re.search(r"(\d+) skipped", summary)
          if skipped and int(skipped.group(1)) > 0:
              sys.exit(f"refusing: {skipped.group(1)} tests were skipped")
          if "passed" not in summary:
              sys.exit(f"unexpected pytest summary: {summary}")
          PY

name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    name: Require main
    runs-on: ubuntu-latest
    steps:
      - name: Refuse any ref other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Refusing to deploy ${{ github.ref }}. Run this workflow from main."
          exit 1

      - name: Confirm main
        if: github.ref == 'refs/heads/main'
        run: echo "Deploying ${{ github.sha }}"

  test:
    name: Test
    needs: guard
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy bot to production
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Pack application tree
        run: |
          tar czf "$RUNNER_TEMP/mike-phuket-ai.tgz" \
            --exclude .git \
            --exclude .github \
            --exclude .env \
            --exclude .venv \
            --exclude '*.tgz' \
            .
          cp "$RUNNER_TEMP/mike-phuket-ai.tgz" mike-phuket-ai.tgz

      - name: Build images on the runner
        working-directory: mike-ai-bot-hkt
        env:
          POSTGRES_PASSWORD: unused
        run: |
          docker compose build bot admin-web partner-web tma-web
          docker save \
            mike-phuket-app:local \
            mike-phuket-admin-web:local \
            mike-phuket-partner-web:local \
            mike-phuket-tma-web:local \
            | gzip -1 > "$RUNNER_TEMP/mike-phuket-images.tgz"
          cp "$RUNNER_TEMP/mike-phuket-images.tgz" "$GITHUB_WORKSPACE/mike-phuket-images.tgz"

      - name: Confirm packs are in the workspace root
        run: ls -lh mike-phuket-ai.tgz mike-phuket-images.tgz

      - name: Prepare upload directory on Droplet
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            as_root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              else
                sudo -n "$@"
              fi
            }
            mkdir -p /opt/mike-phuket-incoming /opt/mike-phuket-ai
            rm -f /opt/mike-phuket-incoming/*.tgz
            rm -f /tmp/mike-phuket-ai.tgz /tmp/mike-phuket-images.tgz || true
            df -h /
            # containerd GC cannot start when the disk has 0 bytes free.
            as_root find /var/lib/docker/containers -name '*-json.log' -size +1M -exec truncate -s 0 {} + || true
            as_root find /var/lib/containerd/io.containerd.content.v1.content/ingest -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
            as_root journalctl --vacuum-size=20M || true
            as_root apt-get clean || true
            df -h /
            docker image prune -af
            docker builder prune -af
            docker container prune -f
            df -h /
            avail_kb="$(df -P / | awk 'NR==2 {print $4}')"
            if [ "$avail_kb" -lt 512000 ]; then
              echo "Need at least 500MB free to upload images, have ${avail_kb}KB"
              exit 1
            fi

      - name: Copy pack to Droplet
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          source: mike-phuket-ai.tgz,mike-phuket-images.tgz
          target: /opt/mike-phuket-incoming
          overwrite: true
          command_timeout: 15m

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            tag_if_present() {
              if docker image inspect "$1:local" >/dev/null 2>&1; then
                docker tag "$1:local" "$1:previous"
              fi
            }
            tag_if_present mike-phuket-app
            tag_if_present mike-phuket-admin-web
            tag_if_present mike-phuket-partner-web
            tag_if_present mike-phuket-tma-web

            ls -lh /opt/mike-phuket-incoming
            if [[ -f /opt/mike-phuket-ai/mike-ai-bot-hkt/.env ]]; then
              cp -a /opt/mike-phuket-ai/mike-ai-bot-hkt/.env /tmp/mike-phuket.env.bak
            fi
            tar xzf /opt/mike-phuket-incoming/mike-phuket-ai.tgz -C /opt/mike-phuket-ai
            if [[ -f /tmp/mike-phuket.env.bak ]]; then
              cp -a /tmp/mike-phuket.env.bak /opt/mike-phuket-ai/mike-ai-bot-hkt/.env
            fi
            if ! gunzip -c /opt/mike-phuket-incoming/mike-phuket-images.tgz | docker load; then
              bash /opt/mike-phuket-ai/mike-ai-bot-hkt/scripts/restore_production_images.sh || true
              exit 1
            fi
            rm -f /opt/mike-phuket-incoming/mike-phuket-images.tgz

            set +e
            SKIP_GIT_PULL=1 SKIP_IMAGE_BUILD=1 /opt/mike-phuket-ai/mike-ai-bot-hkt/scripts/deploy_production.sh
            code=$?
            set -e
            if [[ "$code" -eq 0 ]]; then
              git config --global --add safe.directory /opt/mike-phuket-ai || true
              cd /opt/mike-phuket-ai
              git fetch origin main
              git reset --hard origin/main
              exit 0
            fi
            echo "→ Release failed (exit $code). Restoring previous images."
            if [[ "$code" -eq 2 ]]; then
              bash /opt/mike-phuket-ai/mike-ai-bot-hkt/scripts/restore_production_images.sh --up || true
            else
              bash /opt/mike-phuket-ai/mike-ai-bot-hkt/scripts/restore_production_images.sh || true
            fi
            exit 1

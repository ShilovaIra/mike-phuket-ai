name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy bot + admin panel to staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Pack application tree
        run: |
          tar czf "$RUNNER_TEMP/mike-phuket-ai.tgz" --exclude .git --exclude .github .
          cp "$RUNNER_TEMP/mike-phuket-ai.tgz" mike-phuket-ai.tgz

      - name: Copy pack to Droplet
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          source: mike-phuket-ai.tgz
          target: /tmp
          overwrite: true
          command_timeout: 5m

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          # Sequential image builds on a 1 GB Droplet need more than the 10m default.
          command_timeout: 30m
          script: |
            set -euo pipefail
            tar xzf /tmp/mike-phuket-ai.tgz -C /opt/mike-phuket-ai
            SKIP_GIT_PULL=1 /opt/mike-phuket-ai/mike-ai-bot-hkt/scripts/deploy_staging.sh

      - name: Verify admin panel responds on Droplet
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            ADMIN_WEB_PORT="${ADMIN_WEB_PORT:-8080}"
            code=""
            for _ in $(seq 1 45); do
              if curl -fsS "http://127.0.0.1:${ADMIN_WEB_PORT}/" >/dev/null 2>&1; then
                code="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:${ADMIN_WEB_PORT}/api/stats" || true)"
                if [[ "$code" == "401" ]]; then
                  break
                fi
              fi
              sleep 2
            done
            test "$code" = "401"
            cd /opt/mike-phuket-ai/mike-ai-bot-hkt
            docker compose ps
            echo "Admin panel healthy on :${ADMIN_WEB_PORT}"

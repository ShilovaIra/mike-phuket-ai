name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy bot + admin panel to staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Pack application tree
        run: |
          tar czf "$RUNNER_TEMP/mike-phuket-ai.tgz" --exclude .git --exclude .github .
          cp "$RUNNER_TEMP/mike-phuket-ai.tgz" mike-phuket-ai.tgz

      - name: Build images on the runner
        working-directory: mike-ai-bot-hkt
        env:
          POSTGRES_PASSWORD: unused
        run: |
          docker compose build bot admin-web partner-web tma-web
          docker save \
            mike-phuket-app:local \
            mike-phuket-admin-web:local \
            mike-phuket-partner-web:local \
            mike-phuket-tma-web:local \
            | gzip -1 > "$RUNNER_TEMP/mike-phuket-images.tgz"
          cp "$RUNNER_TEMP/mike-phuket-images.tgz" "$GITHUB_WORKSPACE/mike-phuket-images.tgz"

      - name: Confirm packs are in the workspace root
        run: ls -lh mike-phuket-ai.tgz mike-phuket-images.tgz

      - name: Prepare upload directory on Droplet
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            mkdir -p /opt/mike-phuket-incoming
            rm -f /opt/mike-phuket-incoming/*.tgz
            rm -f /tmp/mike-phuket-ai.tgz /tmp/mike-phuket-images.tgz || true

      - name: Copy pack to Droplet
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          source: mike-phuket-ai.tgz,mike-phuket-images.tgz
          target: /opt/mike-phuket-incoming
          overwrite: true
          command_timeout: 15m

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            ls -lh /opt/mike-phuket-incoming
            tar xzf /opt/mike-phuket-incoming/mike-phuket-ai.tgz -C /opt/mike-phuket-ai
            gunzip -c /opt/mike-phuket-incoming/mike-phuket-images.tgz | docker load
            SKIP_GIT_PULL=1 SKIP_IMAGE_BUILD=1 /opt/mike-phuket-ai/mike-ai-bot-hkt/scripts/deploy_staging.sh

      - name: Verify admin panel responds on Droplet
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            ADMIN_WEB_PORT="${ADMIN_WEB_PORT:-8080}"
            code=""
            for _ in $(seq 1 45); do
              if curl -fsS "http://127.0.0.1:${ADMIN_WEB_PORT}/" >/dev/null 2>&1; then
                code="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:${ADMIN_WEB_PORT}/api/stats" || true)"
                if [[ "$code" == "401" ]]; then
                  break
                fi
              fi
              sleep 2
            done
            test "$code" = "401"
            cd /opt/mike-phuket-ai/mike-ai-bot-hkt
            docker compose --profile tls ps
            echo "Admin panel healthy on :${ADMIN_WEB_PORT}"

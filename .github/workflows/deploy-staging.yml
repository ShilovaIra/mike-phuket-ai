name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy bot + admin panel to staging
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          # Default is 10m; compose --build of bot/admin/partner images on the Droplet exceeds that.
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/mike-phuket-ai
            echo "→ Fetching origin/staging"
            pulled=0
            for attempt in 1 2 3 4 5 6; do
              if timeout 25 git fetch origin staging; then
                git merge --ff-only origin/staging
                pulled=1
                break
              fi
              echo "git fetch failed (attempt ${attempt}/6); retrying in 15s"
              sleep 15
            done
            if [[ "$pulled" != 1 ]]; then
              echo "Droplet cannot resolve github.com (DNS)."
              echo "SSH in: getent hosts github.com && systemctl restart systemd-resolved"
              exit 1
            fi
            SKIP_GIT_PULL=1 ./mike-ai-bot-hkt/scripts/deploy_staging.sh

      - name: Verify admin panel responds on Droplet
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            ADMIN_WEB_PORT="${ADMIN_WEB_PORT:-8080}"
            code=""
            for _ in $(seq 1 45); do
              if curl -fsS "http://127.0.0.1:${ADMIN_WEB_PORT}/" >/dev/null 2>&1; then
                code="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:${ADMIN_WEB_PORT}/api/stats" || true)"
                if [[ "$code" == "401" ]]; then
                  break
                fi
              fi
              sleep 2
            done
            test "$code" = "401"
            cd /opt/mike-phuket-ai/mike-ai-bot-hkt
            docker compose ps
            echo "Admin panel healthy on :${ADMIN_WEB_PORT}"
